
name: Python CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Ruff
        run: python -m ruff check main.py run.py test_main.py

      - name: Run mypy
        run: python -m mypy main.py

      - name: Run pytest
        run: python -m pytest
